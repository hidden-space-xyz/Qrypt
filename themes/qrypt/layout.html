<!doctype html>
<html lang="__LANG_ATTR__" __THEME_ATTRS__ __RTL_SUPPORT__>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Qrypt is a private metasearch engine for people who write code."
    />
    <link
      rel="icon"
      href="__THEME_PATH__/favicon.svg?v=__APP_VERSION__"
      type="image/svg+xml"
    />
    <link
      rel="alternate icon"
      href="/public/favicon/favicon.ico?v=__APP_VERSION__"
      type="image/x-icon"
    />
    <link
      rel="manifest"
      href="/public/favicon/site.webmanifest"
      crossorigin="use-credentials"
    />
    <link
      rel="search"
      type="application/opensearchdescription+xml"
      title="Qrypt"
      href="/opensearch.xml"
    />
    <title>Qrypt</title>
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        var r = document.documentElement;
        if (t === "light") r.setAttribute("data-theme", "light");
        else if (t === "dark") r.setAttribute("data-theme", "dark");
        else {
          var m = window.matchMedia("(prefers-color-scheme: dark)");
          r.setAttribute("data-theme", m.matches ? "dark" : "light");
        }
        var title = document.querySelector("title");
        var brand = function () {
          if (/degoog\s*$/i.test(document.title)) {
            document.title = document.title.replace(/degoog\s*$/i, "Qrypt");
          }
        };
        if (title) {
          new MutationObserver(brand).observe(title, {
            childList: true,
            characterData: true,
            subtree: true,
          });
        }
      })();
    </script>
    <link rel="modulepreload" href="/public/app.js?v=__APP_VERSION__" />
    <link
      rel="stylesheet"
      href="/public/themes/degoog-theme/style.css?v=__APP_VERSION__"
    />
    __THEME_CSS__ __PLUGIN_ASSETS__ __CUSTOM_CSS__
  </head>
  <body __BODY_CLASS__>
    __PAGE_CONTENT__ __THEME_TEMPLATES__
    <script type="module" src="/public/app.js?v=__APP_VERSION__"></script>
  </body>
</html>
