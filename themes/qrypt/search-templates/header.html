<a href="/" class="results-logo qrypt-logo qrypt-logo--sm" aria-label="Qrypt">
  <svg class="qrypt-logo-prompt" viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M6 4.5l8 7.5-8 7.5"
      fill="none"
      stroke="currentColor"
      stroke-width="3.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <span class="qrypt-logo-name">qrypt</span>
</a>
<div
  class="results-search-bar degoog-search-bar degoog-search-bar--results"
  id="results-search-bar"
>
  <span class="search-icon qrypt-prompt" aria-hidden="true">/</span>
  <input
    type="text"
    class="search-input"
    id="results-search-input"
    autocomplete="off"
    spellcheck="false"
  />
  <div class="ac-dropdown" id="ac-dropdown-results"></div>
  <div id="search-bar-actions-results" class="search-bar-actions"></div>
  <button
    class="degoog-icon-btn"
    style="display: none"
    id="results-search-clear-btn"
  >
    <i class="fa-solid fa-times fa-lg"></i>
  </button>
  <button class="search-submit-btn degoog-icon-btn" id="results-search-btn">
    <i class="fa-solid fa-arrow-right fa-lg"></i>
  </button>
</div>
<a
  href="/settings"
  class="header-link settings-gear degoog-icon-btn degoog-icon-btn--padded degoog-icon-btn--results-gear"
  id="nav-settings-results"
  title="Settings"
>
  <i
    class="fa-solid fa-gear fa-xl"
    onmouseenter="this.classList.add('fa-spin')"
    onmouseleave="this.classList.remove('fa-spin')"
  ></i>
</a>
